[package]
name = "anyhook-cli"
version = "0.0.3"
edition = "2024"

[[bin]]
name = "anyhook"
path = "src/main.rs"

[dependencies]
anyhook-core = { path = "../anyhook-core" }
anyhook-engine = { path = "../anyhook-engine" }
anyhook-watchers = { path = "../anyhook-watchers" }
anyhook-actions = { path = "../anyhook-actions" }
anyhook-dashboard = { path = "../anyhook-dashboard" }

clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
notify = { workspace = true }
dirs = "6.0.0"
comfy-table = "7.2.2"

[target."cfg(unix)".dependencies]
daemonize = "0.5.0"
libc = "0.2.189"

[package.metadata.deb]
maintainer = "Anyhook Contributors"
copyright = "2026, Anyhook Contributors"
license-file = ["../../LICENSE", "4"]
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    ["target/release/anyhook", "usr/bin/", "755"],
    ["../../anyhook.yaml", "etc/anyhook/anyhook.yaml.sample", "644"],
]
extended-description = """
A cross-platform event-driven automation engine.
"""
