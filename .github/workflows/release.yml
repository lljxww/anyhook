name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: anyhook
            asset_name: anyhook-linux-x86_64.tar.gz
          
          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: anyhook
            asset_name: anyhook-linux-aarch64.tar.gz

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: anyhook.exe
            asset_name: anyhook-windows-x86_64.zip

          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: anyhook
            asset_name: anyhook-macos-x86_64.tar.gz

          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: anyhook
            asset_name: anyhook-macos-aarch64.tar.gz

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if cross-compiling on Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cross

      - name: Build (Linux Cross)
        if: matrix.os == 'ubuntu-latest'
        run: cross build --release --target ${{ matrix.target }} -p anyhook-cli

      - name: Build (Windows/Mac)
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release --target ${{ matrix.target }} -p anyhook-cli

      - name: Prepare Artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist/anyhook
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/anyhook/
          cp anyhook.yaml dist/anyhook/anyhook.yaml.sample
          cp README.md dist/anyhook/
          cp LICENSE dist/anyhook/
          cd dist
          tar -czvf ${{ matrix.asset_name }} anyhook/

      - name: Prepare Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist/anyhook
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/anyhook/
          cp anyhook.yaml dist/anyhook/anyhook.yaml.sample
          cp README.md dist/anyhook/
          cp LICENSE dist/anyhook/
          cd dist
          7z a -tzip ${{ matrix.asset_name }} anyhook/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.asset_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  build-deb:
    name: Build .deb package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build .deb
        run: cargo deb -p anyhook-cli

      - name: Upload .deb Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: target/debian/*.deb
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python for Cloudsmith
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Cloudsmith CLI
        run: pip install cloudsmith-cli

      - name: Push to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          # 替换为您在 Cloudsmith 上的实际组织/仓库名以及目标发行版 (例如 ubuntu/jammy)
          # 如果想要通用，可以使用 any-distro/any-version
          cloudsmith push deb ${{ github.repository_owner }}/anyhook/any-distro/any-version target/debian/*.deb
